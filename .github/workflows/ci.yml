name: FraudGuard AI CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  frontend-validation:
    name: Frontend Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Frontend Vitest Unit Tests
        run: npm test

      - name: Production Bundle Build
        run: npm run build

  backend-ml-validation:
    name: Backend, ML & Copilot Automated Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend & ML Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov httpx

      - name: Run Backend & ML Pytest Suite
        env:
          ENVIRONMENT: development
          DATABASE_URL: sqlite:///./fraudguard_test.db
          JWT_SECRET_KEY: test_secret_key_for_continuous_integration_testing_32chars_min
          GEMINI_API_KEY: ""
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest backend/tests/ -v --tb=short

  docker-build-verification:
    name: Multi-Container Docker Build Verification
    runs-on: ubuntu-latest
    needs: [frontend-validation, backend-ml-validation]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Backend Container
        run: docker build -t fraudguard-backend:ci -f backend/Dockerfile .

      - name: Build Frontend Container
        run: docker build -t fraudguard-frontend:ci -f frontend/Dockerfile ./frontend
